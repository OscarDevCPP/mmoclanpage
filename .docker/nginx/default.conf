server {
    listen 80;
    server_name _;
    root /srv/site/current;
    index index.html;

    # Keep redirects relative so the browser retains the published host port.
    absolute_redirect off;
    # Revalidate on refresh while developing, including unversioned assets.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
