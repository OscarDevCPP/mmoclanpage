name: Comprobar y publicar Pages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
  build:
    needs: metadata
    if: always() && (github.event_name == 'pull_request' || needs.metadata.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Compilar sitio estático
        env:
          BASE_PATH: ${{ needs.metadata.outputs.base_path }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE_PATH="/mmoclanpage"
          fi
          npm run build -- --base-href "${BASE_PATH}/"
      - name: Subir artefacto de Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/black-talon/browser
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
