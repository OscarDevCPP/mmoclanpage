services:
  builder:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
      target: builder
    volumes:
      - ./src:/app/src:ro,z
      - ./public:/app/public:ro,z
      - site:/site
  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
      target: nginx
    ports:
      - "${SITE_HOST:-0.0.0.0}:${SITE_PORT:-8080}:80"
    volumes:
      - site:/srv/site:ro
volumes:
  site:
