<div class="book-frame" [class.ready]="ready()">
  <div class="book-tools" [hidden]="!ready()" aria-label="Navegación del libro">
    <button class="prev" type="button" aria-label="Página anterior" title="Página anterior" (click)="move(-1)" [disabled]="current() === 0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
    <button class="index" type="button" aria-label="Volver al índice" title="Volver al índice" (click)="goHash('indice')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c4-2 7-1 9 1 2-2 5-3 9-1v14c-4-2-7-1-9 1-2-2-5-3-9-1zM12 6v14"/></svg></button>
    <button class="replay" type="button" aria-label="Volver a ver la presentación del Compendio" title="Volver a ver la presentación del Compendio" (click)="replay.emit()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 6M4 4v6h6M10 8l6 4-6 4z"/></svg></button>
    <a class="home" routerLink="/" aria-label="Ir al inicio" title="Ir al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v10h14V10M10 20v-6h4v6"/></svg></a>
    <button class="next" type="button" aria-label="Página siguiente" title="Página siguiente" (click)="move(1)" [disabled]="current() === pageCount() - 1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>
  </div>
  <div #stage class="book-stage" [class.awaiting]="!ready()" (click)="link($event)" (touchstart)="touchStart($event)" (touchend)="touchEnd($event)" (touchcancel)="touchCancel()"></div>
  <div #source class="book-source" [hidden]="ready()">
    <section class="cover" id="cubierta"><div class="cover-inner"><p>Black Talon [URSS]</p><div class="crest" aria-hidden="true">✦<br>❧</div><h2 tabindex="-1">El Compendio</h2></div></section>
    @for (section of document; track section.id) {
      <section class="document-section" [id]="section.id"><div class="book-reading"><app-book-renderer [fragments]="section.fragments" [anchors]="true" /></div></section>
    }
    <section class="cover" id="final"><div class="cover-inner"><h2 tabindex="-1">Black Talon</h2><p>El Compendio en preparación</p></div></section>
  </div>
  <div #leafSource class="leaf-source" aria-hidden="true" inert>
    <section class="page cover" data-density="hard"><div class="cover-inner"><p>Black Talon [URSS]</p><div class="crest" aria-hidden="true">✦<br>❧</div><h2 tabindex="-1">El Compendio</h2></div></section>
    @for (leaf of draft(); track $index) { <section class="page"><div class="page-inner"><div class="book-reading"><app-book-renderer [fragments]="leaf.fragments" /></div></div></section> }
    <section class="page cover" data-density="hard"><div class="cover-inner"><h2 tabindex="-1">Black Talon</h2><p>El Compendio en preparación</p></div></section>
  </div>
  <app-book-measure />
  <span #fontProbe class="font-probe" aria-hidden="true">M</span>
  @if (!ready()) { <a class="fallback-home" routerLink="/">Volver al inicio</a> }
</div>
