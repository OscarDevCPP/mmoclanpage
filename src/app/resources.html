@if (!guide()) {
  <div class="cinematic">
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="cinema-content">
      <div class="cinema-top"><p>El Compendio · Escena {{ index() + 1 }}/{{ scenes.length }}</p><button class="icon-button" type="button" aria-label="Saltar al Compendio" title="Saltar al Compendio" data-tooltip="Saltar al Compendio" (click)="finish()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l10 7-10 7zM19 5v14"/></svg></button></div>
      <h2 tabindex="-1">{{ scenes[index()].title }}</h2>
      <div class="scene-stage" [attr.data-scene]="index()"><div class="cinema-art"><div class="academy-art"><img [ngSrc]="scenes[index()].image" alt="" fill priority></div></div></div>
      <div class="dialogue" [attr.data-scene]="index()"><img [ngSrc]="'admins/' + scenes[index()].speaker + '.png'" width="320" height="480" priority alt=""><div class="bubble"><strong>{{ scenes[index()].speaker }}</strong><p>{{ scenes[index()].text }}</p></div></div>
      <div class="cinema-controls"><button class="icon-button" type="button" aria-label="Anterior" title="Anterior" data-tooltip="Anterior" (click)="step(-1)" [disabled]="index() === 0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button><button class="icon-button" type="button" [attr.aria-label]="index() === scenes.length - 1 ? 'Ir al Compendio' : 'Siguiente'" [attr.title]="index() === scenes.length - 1 ? 'Ir al Compendio' : 'Siguiente'" [attr.data-tooltip]="index() === scenes.length - 1 ? 'Ir al Compendio' : 'Siguiente'" (click)="step(1)"><svg viewBox="0 0 24 24" aria-hidden="true">@if (index() === scenes.length - 1) { <path d="M4 12l5 5L20 5"/> } @else { <path d="M9 4l8 8-8 8"/> }</svg></button></div>
    </div>
  </div>
} @else {
  <app-resources-book (replay)="replay()" />
}
<noscript [innerHTML]="noScriptContent"></noscript>
