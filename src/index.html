<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Black Talon [URSS] | Clan de PokeMMO</title>
    <base href="/" />
    <link rel="icon" type="image/jpeg" href="clan-logo.jpeg" />
    <script>
      try {
        const theme = localStorage.getItem('black-talon.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch { /* Storage can be unavailable. CSS follows the system preference. */ }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Conoce Black Talon [URSS], un clan latinoamericano de PokeMMO que crece y progresa en equipo."
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
